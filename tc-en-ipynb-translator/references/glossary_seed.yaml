    src: seed
  - tc: 核 / 零空間
    en: kernel / null space
    src: seed
  - tc: 秩零化度定理
    en: rank-nullity theorem
    note: 連字號寫法固定。
    src: seed
  - tc: 多項式空間
    en: polynomial space
    src: seed
  - tc: 函數空間
    en: function space
    src: seed

  # ===== 7. 運算 =====
  - tc: 內積
    en: inner product
    src: seed
  - tc: 點積
    en: dot product
    src: seed
  - tc: 叉積
    en: cross product
    note: 台灣中學常稱「外積」；本表「外積」專指 outer product，勿混。
    src: seed
  - tc: 外積
    en: outer product
    note: 指 uv* = |u⟩⟨v|（秩 1 矩陣）；「外積累加／外積展開」譯 outer-product expansion。不指 cross product，也不指 exterior/wedge product。
    src: seed
  - tc: Hadamard 積
    en: Hadamard product
    note: 對應元素相乘，亦稱 element-wise product。
    src: seed
  - tc: 克羅內克積
    en: Kronecker product
    src: seed
  - tc: 投影
    en: projection
    src: seed
  - tc: 線段
    en: line segment
    src: seed
  - tc: 線性變換
    en: linear transformation
    note: 與「線性映射」（linear mapping）常可互換，逐句依原文用詞對應。
    src: seed
  - tc: 線性映射
    en: linear mapping
    src: seed
  - tc: 矩陣乘法
    en: matrix multiplication
    src: seed
  - tc: 線性方程組
    en: system of linear equations
    note: 亦可簡稱 linear system。
    src: seed
  - tc: 解集
    en: solution set
